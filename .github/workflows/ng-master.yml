name: Nix Guardian (Master)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-syntax:
    # if: false  # Раскомментируй, чтобы пропустить
    uses: ./.github/workflows/ng-validate-syntax.yml

  validate-bootloader:
    # if: false  # Раскомментируй, чтобы пропустить
    uses: ./.github/workflows/ng-validate-bootloader.yml

  build-hosts:
    needs: [validate-syntax, validate-bootloader]
    if: github.event_name == 'push'
    # if: false  # Раскомментируй, чтобы пропустить билд
    uses: ./.github/workflows/ng-build-hosts.yml

  ############################################################
  # АВТОМАТИЧЕСКОЕ СОЗДАНИЕ ISSUE ПРИ ПАДЕНИИ
  ############################################################
  report-failure:
    name: Report CI Failure
    runs-on: ubuntu-latest
    needs: [validate-syntax, validate-bootloader, build-hosts]
    if: failure() && github.event_name == 'push'

    steps:
      - name: Create or Update Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 Nix Guardian CI Failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitSha = context.sha.substring(0, 7);
            const body = `### Сборка или валидация упали!\n\n**Коммит:** \`${commitSha}\`\n**Ветка:** \`${context.ref}\`\n**Логи:** [Открыть прогон CI](${runUrl})\n\nПроверь логи по ссылке выше. Вероятно, кто-то нахуевертил в конфигах.`;
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `**Новое падение на коммите ${commitSha}**\n${runUrl}`
              });
              console.log(`Updated existing issue #${issues.data[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ci-failure', 'bug']
              });
              console.log('Created new issue');
            }
