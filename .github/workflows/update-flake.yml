name: Update Flake Lock

on:
  workflow_dispatch: # Оставляем кнопку ручного запуска
  schedule:
    - cron: "0 3 * * 0" # Каждое воскресенье в 03:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      # Запускаем быструю проверку флейка ДО обновления, чтобы убедиться, что репа вообще здорова
      - name: Pre-check flake
        run: nix flake check --no-build

      # Обновляем лок-файл и создаем красивый Pull Request
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock-action@v21
        with:
          commit-msg: "chore(flake): update system inputs"
          pr-title: "🔄 Flake.lock: Weekly Inputs Update"
          pr-labels: |
            dependencies
            automated
          # ХИТРОСТЬ: Обновляем только основные базы. Если хочешь обновлять ВСЕ, просто удали строчку ниже.
          inputs: "nixpkgs home-manager" 
          token: ${{ secrets.GITHUB_TOKEN }}
