name: Update Flake Lock and Build Cache

on:
  workflow_dispatch: # Запуск вручную через утилиту gh

permissions:
  contents: write # Разрешаем Гитхабу пушить flake.lock обратно в репу

jobs:
  update-and-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          # Включаем нативный кэш Гитхаба, чтобы сама среда Nix разворачивалась мгновенно
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: kori-cachix # Имя твоего кэша
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}' # Наш секретный токен

      - name: Update Flake Lock
        run: nix flake update

      - name: Build System to Cache
        # Гитхаб сам прочитает твой флейк и скомпилирует ТОЛЬКО то, что изменилось.
        # Всё собранное автоматически улетит в твой kori-cachix!
        run: nix build .#nixosConfigurations.Kori-Icebook.config.system.build.toplevel --json

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update flake.lock via GitHub Actions"
          file_pattern: 'flake.lock'
